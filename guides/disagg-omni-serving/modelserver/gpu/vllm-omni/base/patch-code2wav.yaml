apiVersion: v1
kind: ConfigMap
metadata:
  name: standalone-code2wav-config
data:
  standalone-code2wav.yaml: |
    async_chunk: false
    stages:
      - stage_id: 1
        max_num_seqs: 10
        gpu_memory_utilization: 0.3
        max_num_batched_tokens: 65536
        max_model_len: 65536
        devices: "0"
        trust_remote_code: true
        enforce_eager: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code2wav
  labels:
    llm-d.ai/role: code2wav
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-tts
      llm-d.ai/role: code2wav
  template:
    metadata:
      labels:
        app: qwen3-tts
        llm-d.ai/role: code2wav
        llm-d.ai/inference-serving: "true"
        llm-d.ai/guide: "disagg-omni-serving"
    spec:
      containers:
        - name: modelserver
          image: quay.io/rh_ee_rsaini/llm-d-omni-cuda:latest
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
            - "--omni"
            - "--standalone"
            - "--stage-id=1"
            - "--port=8000"
            - "--deploy-config=/etc/vllm-omni/standalone-code2wav.yaml"
            - "--trust-remote-code"
          ports:
            - containerPort: 8000
              name: modelserver
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 16Gi
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: deploy-config
              mountPath: /etc/vllm-omni
          startupProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: deploy-config
          configMap:
            name: standalone-code2wav-config
